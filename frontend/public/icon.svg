<svg xmlns="http://www.svg.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Space Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Spine Gradient (Cyan/Bright Green) -->
    <linearGradient id="spineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Neon Green for FinVest -->
    <linearGradient id="finvestGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Darker Green for the arms (Back layer) -->
    <linearGradient id="armGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Drop Shadow for the overlapping ribbon effect -->
    <filter id="ribbonShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />

  <g transform="translate(10, 0)">
    <!-- Top Horizontal Arm (Back Layer) -->
    <!-- Starts exactly at the spine's center so the caps overlap flawlessly -->
    <line x1="200" y1="160" x2="340" y2="160" stroke="url(#armGradient)" stroke-width="70" stroke-linecap="round" />
    
    <!-- Middle Horizontal Arm (Back Layer) -->
    <line x1="200" y1="270" x2="300" y2="270" stroke="url(#armGradient)" stroke-width="70" stroke-linecap="round" />

    <!-- Spine (Front Layer with shadow) -->
    <line x1="200" y1="160" x2="200" y2="370" stroke="url(#finvestGreen)" stroke-width="70" stroke-linecap="round" filter="url(#ribbonShadow)" />
  </g>

</svg>
